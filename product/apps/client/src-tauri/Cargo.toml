[package]
name = "pixel-mix"
version = "1.2.0"
edition = "2021"
description = "Programmer Mixology local-first taste and recipe workbench"
license = "MIT"
repository = "https://github.com/UNKNOWNTIMER/programmer-mixology"

[lib]
name = "pixel_mix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
pixelmix-domain = { path = "../../../crates/domain" }
pixelmix-catalog = { path = "../../../crates/catalog" }
pixelmix-recipe-engine = { path = "../../../crates/recipe_engine" }
pixelmix-lan-host = { path = "../../../crates/lan_host" }
pixelmix-inference = { path = "../../../crates/inference" }

[target.'cfg(windows)'.dependencies]
drag = "=2.1.1"
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
